// Environment values win; local Android Studio builds use an ignored private file.
def privateFile = rootProject.file('.local-secrets/upstream-credentials.json')
def privateValues = privateFile.exists() ? new groovy.json.JsonSlurper().parse(privateFile) : [:]
def names = new groovy.json.JsonSlurper().parse(rootProject.file('tools/upstream-credential-names.json'))
names.each { name ->
    def value = providers.environmentVariable(name).orNull ?: privateValues[name] ?: ''
    android.defaultConfig.buildConfigField 'String', name, groovy.json.JsonOutput.toJson(value)
}
