name: Android Development Build

on:
  push:
    branches: [main]
    paths: [dev.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niktv-development-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: zulu
          cache: gradle
      - name: Read development version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < dev.txt)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "dev.txt must contain x.y.z"; exit 1; }
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=dev-v$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))" >> "$GITHUB_ENV"
      - name: Apply version
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
      - name: Configure signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" ]] || { echo "KEYSTORE and KEYSTORE_PASSWORD are required"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/niktv.keystore"
          ALIAS=$(keytool -list -v -keystore "$RUNNER_TEMP/niktv.keystore" -storepass "$KEYSTORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -n 1)
          [[ -n "$ALIAS" ]] || { echo "Could not determine key alias"; exit 1; }
          echo "DEV_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
      - name: Build signed debug APK
        env:
          DEV_KEYSTORE_PATH: ${{ runner.temp }}/niktv.keystore
          DEV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DEV_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
          mkdir -p "$RUNNER_TEMP/niktv-apks"
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "$RUNNER_TEMP/niktv-apks/NikTV-${TAG}-arm64-v8a.apk"
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk "$RUNNER_TEMP/niktv-apks/NikTV-${TAG}-armeabi-v7a.apk"
          cp app/build/outputs/apk/debug/app-universal-debug.apk "$RUNNER_TEMP/niktv-apks/NikTV-${TAG}-universal.apk"
          cp app/build/outputs/apk/debug/app-universal-debug.apk "$RUNNER_TEMP/niktv-apks/NikTV-${TAG}.apk"
          ./gradlew clean assembleDebug -PfireTvApk=true
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/niktv-apks/NikTV-${TAG}-firetv.apk"
      - name: Verify published APK identities
        shell: bash
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          [[ -n "$AAPT" ]] || { echo "aapt not found"; exit 1; }
          for APK in "$RUNNER_TEMP"/niktv-apks/*.apk; do
            BADGING=$("$AAPT" dump badging "$APK")
            PACKAGE=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING")
            APK_VERSION=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")
            [[ "$PACKAGE" == "com.nikhil.niktv.debug" && "$APK_VERSION" == "${VERSION}-dev" ]] || {
              echo "::error::Incorrect distribution in $APK: $PACKAGE $APK_VERSION"
              exit 1
            }
          done
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/niktv-apks/*.apk
          tag_name: ${{ env.TAG }}
          name: NikTV Development ${{ env.VERSION }}
          prerelease: true
          generate_release_notes: true
