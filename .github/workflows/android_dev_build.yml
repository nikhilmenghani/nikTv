name: Android Development Build

on:
  push:
    branches: [main]
    paths: [dev.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niktv-development-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: zulu
          cache: gradle
      - name: Read development version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < dev.txt)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "dev.txt must contain x.y.z"; exit 1; }
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=dev-v$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))" >> "$GITHUB_ENV"
      - name: Apply version
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
      - name: Configure signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" ]] || { echo "KEYSTORE and KEYSTORE_PASSWORD are required"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/niktv.keystore"
          ALIAS=$(keytool -list -v -keystore "$RUNNER_TEMP/niktv.keystore" -storepass "$KEYSTORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -n 1)
          [[ -n "$ALIAS" ]] || { echo "Could not determine key alias"; exit 1; }
          echo "DEV_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
      - name: Build signed debug APK
        env:
          DEV_KEYSTORE_PATH: ${{ runner.temp }}/niktv.keystore
          DEV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DEV_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NIKTV_DEFAULT_PROFILE_NAME: ${{ secrets.NIKTV_DEFAULT_PROFILE_NAME }}
          NIKTV_DEFAULT_PORTAL_URL: ${{ secrets.NIKTV_DEFAULT_PORTAL_URL }}
          NIKTV_DEFAULT_MAC_ADDRESS: ${{ secrets.NIKTV_DEFAULT_MAC_ADDRESS }}
          NIKTV_DEFAULT_SERIAL_NUMBER: ${{ secrets.NIKTV_DEFAULT_SERIAL_NUMBER }}
          NIKTV_XTREAM_PROFILE_NAME: ${{ secrets.NIKTV_XTREAM_PROFILE_NAME }}
          NIKTV_XTREAM_PORTAL_URL: ${{ secrets.NIKTV_XTREAM_PORTAL_URL }}
          NIKTV_XTREAM_USERNAME: ${{ secrets.NIKTV_XTREAM_USERNAME }}
          NIKTV_XTREAM_PASSWORD: ${{ secrets.NIKTV_XTREAM_PASSWORD }}
          NIKTV_TMDB_API_KEY: ${{ secrets.NIKTV_TMDB_API_KEY }}
          NIKTV_TMDB_READ_ACCESS_TOKEN: ${{ secrets.NIKTV_TMDB_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "$NIKTV_TMDB_API_KEY" ] && [ -z "$NIKTV_TMDB_READ_ACCESS_TOKEN" ]; then
            echo "::error::Neither NIKTV_TMDB_API_KEY nor NIKTV_TMDB_READ_ACCESS_TOKEN is configured"
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/NikTV-${TAG}.apk"
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/NikTV-${{ env.TAG }}.apk
          tag_name: ${{ env.TAG }}
          name: NikTV Development ${{ env.VERSION }}
          prerelease: true
          generate_release_notes: true
