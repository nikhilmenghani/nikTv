<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <title>NikTV Preview</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <object id="av-player" type="application/avplayer"></object>
  <main id="setup">
    <p class="brand">NikTV <span>Samsung Preview</span></p>
    <h1>Let’s get playback working.</h1>
    <p>Open a direct stream to test your TV. Portal sign-in and your library are coming next.</p>
    <button id="sample">Play sample video</button>
    <label for="stream-url">Or enter a stream URL</label>
    <input id="stream-url" type="url" placeholder="https://…/stream.m3u8" autocomplete="off">
    <button id="play">Play stream</button>
    <p class="hint">Use the arrows and Enter to select. Return stops playback.</p>
  </main>
  <aside id="controls" hidden>
    <button id="pause">Pause / Resume</button>
    <button id="stop">Stop</button>
  </aside>
  <p id="status" role="status" aria-live="polite">Ready</p>
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
