
apply plugin: 'com.android.library'
apply from: rootProject.file('niktube-smarttube/SharedModules/constants.gradle')
android {
    namespace 'com.liskovsoft.smartyoutubetv2.common'
    compileSdk 37
    defaultConfig {
        minSdk 24
        buildConfigField 'String', 'FLAVOR', '"ststable"'
        buildConfigField 'String', 'VERSION_NAME', '"32.67"'
        buildConfigField 'int', 'VERSION_CODE', '2457'
        buildConfigField 'long', 'TIMESTAMP', '0L'
        consumerProguardFiles 'build/embedded/consumer-rules.pro'
    }
    buildFeatures { buildConfig true }
    sourceSets.main {
        java.setSrcDirs(['build/embedded/main/java'])
        kotlin.setSrcDirs(['build/embedded/main/java'])
        res.setSrcDirs(['build/embedded/main/res'])
        assets.setSrcDirs(['build/embedded/main/assets'])
        jniLibs.setSrcDirs(['build/embedded/main/jniLibs', 'build/embedded/main/libs'])
        manifest.srcFile 'build/embedded/main/AndroidManifest.xml'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}
ext.modulePrefix = ':st-exoplayer-'
ext.protobufVersion = '3.17.3'
ext.androidXTestVersion = '1.6.1'
ext.kotlinVersion = '2.4.10'
ext.kotlinxVersion = '1.11.0'
ext.coreXVersion = '1.19.0'
ext.kotlinCoreXVersion = '1.19.0'
dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5' }
configurations.configureEach {
    exclude group: 'androidx.leanback', module: 'leanback'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:' + appCompatXVersion
    testImplementation 'junit:junit:' + junitVersion
    testImplementation 'org.robolectric:robolectric:' + robolectricVersion

    implementation project(':st-sharedutils')
    implementation project(':st-fragment-1.1.0')
    implementation project(':st-mediaserviceinterfaces')
    implementation project(':st-youtubeapi')
    implementation project(':st-filepicker-lib')

    implementation 'io.reactivex.rxjava2:rxandroid:' + rxAndroidVersion
    implementation 'io.reactivex.rxjava2:rxjava:' + rxJavaVersion

    //////// BEGIN EXOPLAYER /////////

    implementation project(':st-exoplayer-library')
    implementation project(':st-exoplayer-extension-okhttp')
    implementation project(':st-exoplayer-extension-cronet')

    // implementation 'com.amazon.android:exoplayer:' + amazonExoplayerVersion
    // implementation 'com.amazon.android:extension-okhttp:' + amazonExoplayerVersion

    // implementation 'com.google.android.exoplayer:exoplayer:' + exoplayerVersion
    // implementation 'com.google.android.exoplayer:extension-okhttp:' + exoplayerVersion

    // implementation 'com.github.amzn:exoplayer-amazon-port:' + amazonExoplayerJitpackVersion

    //////// END EXOPLAYER //////////

    implementation 'androidx.media:media:' + mediaXVersion // exoplayer fix

    implementation 'com.github.bumptech.glide:glide:' + glideVersion

    implementation 'androidx.work:work-runtime:' + workVersion
    implementation 'com.google.guava:guava:' + guavaVersion // Work library deps

    implementation 'androidx.browser:browser:' + browserXVersion

    implementation 'androidx.core:core-ktx:' + kotlinCoreXVersion
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:' + kotlinVersion
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:' + kotlinxVersion

    implementation 'com.jakewharton:process-phoenix:' + phoenixVersion

    implementation project(':st-leanbackassistant')

    implementation project(':st-appupdatechecker2')

    implementation project(':st-slidableactivity') // https://github.com/r0adkll/Slidr
}