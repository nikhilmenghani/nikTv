plugins { id 'com.android.library' }
android {
    namespace 'com.newtube.sabr'
    compileSdk 36
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main {
        java.setSrcDirs(['src/main/java/com', layout.buildDirectory.dir('generated/sabr/java')])
        assets.srcDir 'legal'
    }
    lint { disable 'UnsafeOptInUsageError' }
    testOptions.unitTests.includeAndroidResources = true
    sourceSets.test.java.srcDir 'src/testSupport/java'
}
configurations { sabrProtoc }
def compilerPlatform = System.getProperty('os.name').toLowerCase().contains('windows') ? 'windows-x86_64' :
        (System.getProperty('os.name').toLowerCase().contains('mac') ? 'osx-x86_64' : 'linux-x86_64')
dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    api 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'com.google.protobuf:protobuf-javalite:3.22.3'
    sabrProtoc "com.google.protobuf:protoc:3.22.3:${compilerPlatform}@exe"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
}
def generateSabrProto = tasks.register('generateSabrProto', Exec) {
    def schemas = fileTree('src/main/proto') { include '**/*.proto' }
    def destination = layout.buildDirectory.dir('generated/sabr/java')
    inputs.files(schemas, configurations.sabrProtoc)
    outputs.dir(destination)
    doFirst {
        destination.get().asFile.mkdirs()
        configurations.sabrProtoc.singleFile.setExecutable(true)
        commandLine([configurations.sabrProtoc.singleFile.absolutePath,
            '--proto_path=' + file('src/main/proto').absolutePath,
            '--java_out=lite:' + destination.get().asFile.absolutePath] + schemas.files.sort { it.path }.collect { it.absolutePath })
    }
}
tasks.named('preBuild').configure { dependsOn generateSabrProto }
